<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行线路图 · Travel Routes</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="travel-title">旅行线路图<span class="sub" id="travel-subtitle"></span></h1>
    <div class="route-tabs" id="route-tabs"></div>
    <div class="legend">
      <span class="lg"><span class="dot ink"></span>固定路线点</span>
      <span class="lg"><span class="dot amber"></span>可选点（点击下拉选择）</span>
      <span class="lg"><span class="dot rust"></span>应急方案</span>
      <span class="lg"><span class="dot cancel"></span>已取消点位</span>
      <span class="lg" style="color:var(--muted)">底图：高德地图（右上角切换图层）</span>
    </div>
  </header>

  <div class="main">
    <div class="map-card">
      <div id="map"></div>
      <div class="map-watermark" id="map-watermark"></div>
    </div>
    <div class="side" id="sidebar">
      <div class="kpis" id="kpis"></div>
      <div class="summary">
        <h2>当前选择摘要</h2>
        <div class="chips" id="chips"></div>
      </div>
      <div class="accordion" id="acc-options">
        <div class="accordion-header" data-target="acc-options-body">
          <span class="ah-title">行程决策</span>
          <span class="accordion-arrow">▼</span>
        </div>
        <div class="accordion-body" id="acc-options-body">
          <div id="cards"></div>
        </div>
      </div>
      <div class="accordion collapsed" id="acc-days">
        <div class="accordion-header" data-target="acc-days-body">
          <span class="ah-title">日程一览</span>
          <span class="accordion-arrow">▼</span>
        </div>
        <div class="accordion-body" id="acc-days-body">
          <div class="days">
            <table id="days-table">
              <tr><th>天</th><th>路线</th><th>里程</th><th>亮点 / 决策</th></tr>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    点位坐标为真实经纬度（已做 GCJ-02 纠偏对齐高德底图）· 点击圆点查看详情
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js?v=15"></script>
<script src="app.js?v=15"></script>
</body>
</html>
